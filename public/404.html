<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | MD Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --p: #8a1cff;
        --g: #16ff3c;
        --k: #050308;
        --w: #f6f2ff;
        --muted: #b9aed6;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--k);
        color: var(--w);
        font: 500 18px/1.5 Rajdhani, system-ui, sans-serif;
        overflow-x: hidden;
        position: relative;
      }

      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: .08;
        background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: min(760px, 100%);
      }

      .card {
        position: relative;
        text-align: center;
        padding: 36px 24px 30px;
        background: #0d0a13;
        border: 3px solid #000;
        box-shadow: 12px 12px 0 var(--p), 0 0 0 1px rgba(255,255,255,0.04);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(138,28,255,.08), rgba(22,255,60,.04));
        pointer-events: none;
      }

      .card > * { position: relative; z-index: 1; }

      .tag {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        background: var(--p);
        color: #fff;
        font: 400 12px Bungee, Impact, sans-serif;
        letter-spacing: 0.08em;
        border: 3px solid #000;
        transform: rotate(-2deg);
        text-transform: uppercase;
      }

      img {
        display: block;
        width: min(230px, 62vw);
        margin: 0 auto 10px;
        filter: drop-shadow(8px 10px 0 #000);
      }

      h1 {
        margin: 0;
        font: 400 clamp(4rem, 11vw, 9rem) Bungee, Impact, sans-serif;
        line-height: .85;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--w);
        text-shadow: 6px 6px 0 var(--p);
      }

      p {
        max-width: 500px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.4;
      }

      .actions {
        margin-top: 28px;
      }

      a {
        display: inline-block;
        padding: 15px 26px;
        background: var(--g);
        color: #000;
        text-decoration: none;
        border: 3px solid #000;
        box-shadow: 6px 6px 0 var(--p);
        font: 400 16px Bungee, Impact, sans-serif;
        transition: transform .15s ease, box-shadow .15s ease;
      }

      a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0 var(--p);
      }

      .ghost {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -55%);
        font: 400 clamp(7rem, 35vw, 22rem) Bungee, Impact, sans-serif;
        color: transparent;
        -webkit-text-stroke: 2px rgba(255,255,255,0.08);
        line-height: 1;
        pointer-events: none;
        z-index: 0;
      }

      @media (max-width: 520px) {
        .card {
          padding: 28px 18px 26px;
        }

        .ghost {
          top: 46%;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="ghost">404</div>
        <div class="tag">Erro 404</div>
        <img src="/img/scared.webp" alt="Mascote MD Bot confuso">
        <h1>404</h1>
        <p>Essa página não existe ou foi movida. Mas você ainda pode voltar ao início e continuar no MD Bot.</p>
        <div class="actions">
          <a href="/">Voltar ao início</a>
        </div>
      </div>
    </div>
  </body>
</html>
